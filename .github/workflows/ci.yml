name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # --legacy-peer-deps is required, not optional: .npmrc sets it because
      # react-leaflet@5.0.0 declares react ^19 while the repo pins react@18.3.1.
      # That conflict is real and tracked separately — do not drop the flag here.
      - run: npm ci --legacy-peer-deps

      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
